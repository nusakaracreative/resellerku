name: Resellerku Worker CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "tsconfig.json"
      - "wrangler.toml"
      - ".github/workflows/worker-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "tsconfig.json"
      - "wrangler.toml"
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Configure temporary CI-only secrets
        run: |
          printf 'SUPABASE_SERVICE_ROLE_KEY="ci-placeholder"\nGEMINI_API_KEY="ci-placeholder"\n' > .dev.vars
      - name: Wrangler bundle dry-run
        run: npx wrangler deploy --dry-run --outdir .wrangler-ci
